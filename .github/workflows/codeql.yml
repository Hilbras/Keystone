name: CodeQL

# Static analysis for the security defects that a test suite cannot catch:
# injection, deserialisation, missing authorisation on a path, and the rest of
# the query-injection family. Runs on every push and pull request, and weekly, so
# a dependency that pulls in a vulnerable pattern is noticed even on a quiet
# week.

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3/init
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3/autobuild

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3/analyze
        with:
          category: "/language:${{ matrix.language }}"
          # A finding fails the job. An alert nobody has to deal with is not a
          # control, and this repository's history is one of a finding being
          # defined but never acted on.
          fail-on-severity: error
