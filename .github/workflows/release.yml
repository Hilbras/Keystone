name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hilbras
          POSTGRES_PASSWORD: hilbras
          POSTGRES_DB: hilbras
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify tag and package versions
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          test "$(node -p "require('./package.json').version")" = "$VERSION"
          test "$(node -p "require('./package-lock.json').version")" = "$VERSION"

      - name: Install backend dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build backend
        run: npm run build

      - name: Run backend tests
        env:
          DATABASE_URL: postgresql://hilbras:hilbras@localhost:5432/hilbras
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
          KEYSTONE_INTERNAL_API_KEY: test-key
          KEYSTONE_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
        run: npm test -- --test-timeout=60000

      - name: Run authorization security regression suite
        env:
          DATABASE_URL: postgresql://hilbras:hilbras@localhost:5432/hilbras
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
          KEYSTONE_INTERNAL_API_KEY: test-key
          KEYSTONE_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
        run: npm run test:security

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build SDK
        working-directory: packages/keystone-sdk
        run: npm ci && npm run build

      - name: Package release artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          tar -czf "hilbras-keystone-${VERSION}-dist.tar.gz" dist
          tar -czf "hilbras-keystone-${VERSION}-frontend.tar.gz" -C frontend dist
          tar -czf "hilbras-keystone-sdk-${VERSION}.tar.gz" -C packages/keystone-sdk dist
          sha256sum hilbras-keystone-*.tar.gz > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            hilbras-keystone-*.tar.gz
            SHA256SUMS.txt

  publish:
    needs: [verify, npm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            hilbras-keystone-*.tar.gz
            SHA256SUMS.txt

  npm:
    needs: verify
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install package
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Verify package contents
        run: |
          npm pack --dry-run
          test -f dist/cli.js
          node dist/cli.js --help >/dev/null

      - name: Install and smoke-test packed tarball
        run: |
          TARBALL="$(npm pack --silent)"
          rm -rf /tmp/keystone-package-smoke
          mkdir -p /tmp/keystone-package-smoke
          npm install --prefix /tmp/keystone-package-smoke --ignore-scripts "./$TARBALL"
          node /tmp/keystone-package-smoke/node_modules/@hilbras/keystone/dist/cli.js --help >/dev/null
          rm -f "$TARBALL"

      - name: Publish npm package
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  docker:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
