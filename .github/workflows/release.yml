name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hilbras
          POSTGRES_PASSWORD: hilbras
          POSTGRES_DB: hilbras
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify tag and package versions
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          test "$(node -p "require('./package.json').version")" = "$VERSION"
          test "$(node -p "require('./package-lock.json').version")" = "$VERSION"

      - name: Install backend dependencies
        run: npm ci

      # ---------------------------------------------------------------------
      # Security gate. Every step below must pass for a release to proceed.
      # The order is deliberate: cheap checks first, so an obvious problem does
      # not cost a full test run to discover.
      # ---------------------------------------------------------------------

      - name: Gate — no critical or high advisory without a documented exception
        shell: bash
        run: |
          set -euo pipefail
          npm audit --omit=dev --audit-level=high --json > audit.json || true
          critical=$(node -p "Object.values(require('./audit.json').vulnerabilities||{}).filter(v=>v.severity==='critical').length")
          high=$(node -p "Object.values(require('./audit.json').vulnerabilities||{}).filter(v=>v.severity==='high').length")
          echo "critical=$critical high=$high"
          if [ "$critical" != "0" ] || [ "$high" != "0" ]; then
            echo "::error::Release blocked: $critical critical and $high high advisories."
            echo "Each must be recorded in docs/security/registry-exceptions.md with a reason and an expiry."
            exit 1
          fi

      - name: Gate — security regression registry is consistent
        run: npm run registry:check

      - name: Gate — the built image carries no credential material
        # The npm tarball has had this check since 2.1.0. The container path did
        # not, and that asymmetry was a finding: `COPY . .` with no .dockerignore
        # sent a developer's .env, the 15 MB .git/ and 240 MB of node_modules/ to
        # the Docker daemon. The published image was verified clean, so this is
        # about the context and the build cache, not a secret in the artefact.
        run: node scripts/verify-image-hygiene.mjs --build

      - name: Gate — documentation links resolve
        # Documentation rots quietly: a file is renamed, a heading reworded, and
        # the link still looks right in the source while 404ing for the reader.
        # No test catches that, and the people who hit a dead link are usually
        # the ones evaluating the project for the first time.
        run: npm run check:docs

      - name: Gate — the re-audit matrix regenerates and every claim verifies
        # The matrix is generated from the registry and checked against the
        # repository. A cell that cannot be verified is a claim nobody has
        # checked, and shipping one in a release document is the failure this
        # gate exists to prevent.
        run: npm run reaudit:check

      - name: Gate — every route has an authentication guard, and every guard name resolves
        # `review:api` was a report nobody read, which protected nothing, and it
        # was wrong four times before it was right. The mechanically decidable
        # half is a gate now: a route with no guard and no written reason, an
        # entry in PUBLIC_BY_DESIGN with no reason, or a guard name that resolves
        # to nothing.
        #
        # The last of those is the one that matters most and the one that could
        # not be caught any other way. A misspelled guard is not a load-time
        # error: Fastify evaluates `preHandler: [app.authentcate]` to `undefined`
        # and skips it, so the route ships unauthenticated and every test that
        # does not happen to call it still passes.
        #
        # The two report-only categories — "authenticated, no authorization
        # guard" (27 routes) and "state-changing, no rate limit" (30) — are not
        # gated, and scripts/review-api-surface.mjs says why in full.
        run: node scripts/review-api-surface.mjs --strict

      - name: Gate — no secrets in the repository or its history
        # The gitleaks *action* v2 requires a paid licence for organisations and
        # aborts before scanning, so the CLI is run from its container instead —
        # the same approach as sast.yml. These must stay in step: the action form
        # here failed the 3.0.0 release on the licence check, after the identical
        # step in sast.yml had already been fixed.
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            zricethezav/gitleaks:latest \
            detect \
              --source /repo \
              --config /repo/.gitleaks.toml \
              --redact \
              --no-banner \
              --log-opts="--all"

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build backend
        run: npm run build

      - name: Run backend and security tests
        env:
          DATABASE_URL: postgresql://hilbras:hilbras@localhost:5432/hilbras
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
          KEYSTONE_INTERNAL_API_KEY: test-key
          KEYSTONE_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
        # One run, not two. `npm test` globs `dist/tests/**` and therefore
        # already includes all 402 security tests — the separate `test:security`
        # step re-ran the same files, which doubled the request volume against
        # the shared Redis and tripped the global rate limiter mid-suite, failing
        # the release on 429s where the assertions were sound.
        #
        # The security gate below now proves the suite is *part of* this run
        # rather than executing it a second time.
        run: npm test -- --test-timeout=60000

      - name: Gate — the security suite is part of that run
        shell: bash
        run: |
          set -euo pipefail
          suites=$(find dist/tests/security -name '*.test.js' | wc -l)
          tests=$(grep -rhoE '^\s*it\(' dist/tests/security --include='*.test.js' | wc -l)
          echo "security suites: $suites, tests: $tests"
          if [ "$suites" -eq 0 ]; then
            echo "::error::No security suites found. The security gate would be vacuous."
            exit 1
          fi
          if [ "$tests" -lt 100 ]; then
            echo "::error::Only $tests security tests discovered; expected the full suite."
            exit 1
          fi

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build SDK
        working-directory: packages/keystone-sdk
        run: npm ci && npm run build

      - name: Package release artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          tar -czf "hilbras-keystone-${VERSION}-dist.tar.gz" dist
          tar -czf "hilbras-keystone-${VERSION}-frontend.tar.gz" -C frontend dist
          tar -czf "hilbras-keystone-sdk-${VERSION}.tar.gz" -C packages/keystone-sdk dist
          sha256sum hilbras-keystone-*.tar.gz > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            hilbras-keystone-*.tar.gz
            SHA256SUMS.txt

  publish:
    needs: [verify, npm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            hilbras-keystone-*.tar.gz
            SHA256SUMS.txt

  npm:
    needs: verify
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install package
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Verify package contents
        run: |
          npm pack --dry-run
          test -f dist/cli.js
          node dist/cli.js --help >/dev/null

      - name: Install and smoke-test packed tarball
        run: |
          TARBALL="$(npm pack --silent)"
          rm -rf /tmp/keystone-package-smoke
          mkdir -p /tmp/keystone-package-smoke
          npm install --prefix /tmp/keystone-package-smoke --ignore-scripts "./$TARBALL"
          node /tmp/keystone-package-smoke/node_modules/@hilbras/keystone/dist/cli.js --help >/dev/null
          rm -f "$TARBALL"

      - name: Verify release metadata
        run: npm run verify:release

      - name: Publish npm package
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  docker:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
