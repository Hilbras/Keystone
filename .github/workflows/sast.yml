name: Static analysis

# Semgrep and Gitleaks, the two remaining tools from the plan's static-analysis
# list.
#
# They are split into a blocking job and an advisory job on purpose.
#
#   Blocking  — the project ruleset in `.semgrep.yml`, which encodes defects this
#               codebase actually shipped. Every rule was verified to fire on a
#               deliberately vulnerable fixture and to stay silent on the real
#               backend, so a finding is actionable.
#   Advisory  — the community rulesets. They produce findings this repository has
#               triaged and judged either false positives or already handled, and
#               gating on a community ruleset nobody has worked through means
#               either a permanently red build or a gate that gets switched off.
#               They still run and still report, so the signal is not lost: the
#               triage that produced this split is recorded in
#               `docs/security/registry.md`, and one real finding came out of it
#               (SEC-045).
#
# Gitleaks runs as the CLI in a container rather than through
# `gitleaks/gitleaks-action`, which requires a paid licence for organisations and
# fails immediately without one.

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  semgrep-project-rules:
    name: Semgrep (project rules)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run project rules
        # `src`, `packages` and `scripts` — not `src` alone.
        #
        # The scan was `src`-only on the stated grounds that "the security-relevant
        # logic is all in `src/`". That was an assumption, and it was wrong in the
        # way this repository keeps finding: `packages/` is 1,107 lines of
        # published credential-handling code — PKCE verifiers, nonces, token
        # storage, cookie handling — and `scripts/` is 2,924 lines that *are* the
        # security controls. Four thousand lines no rule had ever been pointed at.
        #
        # The second stated ground was real and still is: `frontend/` is 69 `.tsx`
        # files, and Semgrep's TypeScript support trips over TSX generics versus JSX
        # ambiguity in a way that aborts the whole scan rather than skipping one
        # file. `packages/keystone-react/src/index.tsx` was checked separately and
        # parses at 100%, so the exclusion is `frontend/` and not TSX. A file
        # extension is not a reason to skip a directory that shares it.
        #
        # Every rule in `.semgrep.yml` now carries a `paths` block stating where its
        # construct can exist, so widening the scan widens the coverage rather than
        # the noise.
        run: >
          semgrep scan
          --config .semgrep.yml
          --error
          --metrics off
          --sarif --output semgrep-project.sarif
          src packages scripts

  semgrep-community-rules:
    name: Semgrep (community rules, advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep:latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run community rules
        # No --error. This job reports; it does not gate. See the header.
        #
        # Scoped the same way as the project rules, and for the same reason: the
        # published packages handle tokens and cookies, which is the community
        # rules' subject matter, and there is no reason to find out about them from
        # a report rather than a gate.
        run: >
          semgrep scan
          --config p/default
          --config p/security-audit
          --config p/owasp-top-ten
          --metrics off
          --sarif --output semgrep-community.sarif
          src packages scripts

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3/upload-sarif
        with:
          sarif_file: semgrep-community.sarif
          category: semgrep-community

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history, not just the tip. A secret introduced and removed
          # within a branch is still in the history and still in every clone.
          fetch-depth: 0

      - name: Scan for committed secrets
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            zricethezav/gitleaks:latest \
            detect \
              --source /repo \
              --config /repo/.gitleaks.toml \
              --redact \
              --no-banner \
              --log-opts="--all"
