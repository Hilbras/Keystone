# Project-specific Semgrep rules.
#
# Each rule here corresponds to a defect this codebase has actually shipped, or
# to an ordering trap that silently disabled a control. A ruleset of only generic
# patterns would be redundant with the `p/security-audit` ruleset already in the
# workflow; the value of a project ruleset is that it encodes what went wrong
# *here*, which no general rule can know.
#
# Run locally:  npx semgrep scan --config .semgrep.yml
# Every rule is mapped to its registry entry so a finding can be traced back.

rules:
  # SEC-008 — trustProxy: true accepts x-forwarded-for from any peer, which
  # defeats every address-based rate limit and every IP allowlist.
  - id: keystone-no-unconditional-trust-proxy
    patterns:
      - pattern-either:
          - pattern: "fastify({..., trustProxy: true, ...})"
          - pattern: "$FASTIFY.set({..., trustProxy: true, ...})"
    # WHY THIS SCOPE — A trust-proxy setting belongs to a server. Nothing in `packages/` or `scripts/` configures one, so scanning them can only produce noise — and a rule that cries wolf is a rule people stop reading.
    paths:
      include:
        - "/src/**"

    message: >-
      trustProxy: true trusts x-forwarded-for from any peer, so a client can
      present a fresh address per request. Use the configured trusted networks in
      src/services/trustedProxies.ts instead. (SEC-008)
    severity: ERROR
    languages: [javascript, typescript]

  # SEC-007 — a client-supplied header treated as an authenticated identity.
  - id: keystone-no-client-supplied-identity-header
    patterns:
      - pattern-either:
          - pattern: request.headers["x-service-account-id"]
          - pattern: request.headers["x-user-id"]
          - pattern: request.headers["x-org-id"]
          - pattern: req.headers["x-service-account-id"]
          - pattern: req.headers["x-user-id"]
    # WHY THIS SCOPE — Server-side: the risk is trusting an identity header that arrived in a request. The SDK packages *send* identity, they do not accept it, so the rule is meaningless there and would only fire on the wrong code.
    paths:
      include:
        - "/src/**"

    message: >-
      This header is client-supplied. Identity must be derived from a verified
      credential, not asserted by the caller. (SEC-007, SEC-009)
    severity: ERROR
    languages: [javascript, typescript]

  # SEC-033 — a limiter that fails open when its backing store is unavailable.
  - id: keystone-rate-limit-fails-open
    patterns:
      - pattern-inside: |
          if (!$IS_READY) {
            ...
            return true;
          }
      - pattern: return true;
    # WHY THIS SCOPE — Server-side. Scoping this one is not a way to quiet a finding: the first unscoped run matched `if (!file) { ... return true; }` in `scripts/render-reaudit-matrix.mjs` — a file-existence check that happens to have the shape of a limiter's failure path. Nothing in `packages/` or `scripts/` serves HTTP, so a rate limiter cannot exist there and the rule cannot have anything to say.
    paths:
      include:
        - "/src/**"

    message: >-
      A limiter that returns true when its store is unavailable removes the
      control entirely during an outage, which is when unlimited attempts are
      worth having. Use the bounded local fallback. (SEC-033)
    severity: ERROR
    languages: [javascript, typescript]

  # SEC-027, SEC-028 — a credentialed wildcard CORS policy.
  - id: keystone-credentialed-wildcard-cors
    patterns:
      - pattern-either:
          - pattern: "{ ..., origin: true, credentials: true, ... }"
          - pattern: "{ ..., origin: '*', credentials: true, ... }"
    # WHY THIS SCOPE — A CORS policy can be set by a server or by a browser client. The react and vue packages send credentialed requests, so a wildcard there is the same defect it is in a route. Not `scripts/`: nothing in a build script makes a cross-origin request with cookies.
    paths:
      include:
        - "/src/**"
        - "/packages/**"

    message: >-
      Credentialed requests with an unrestricted origin produce a wildcard CORS
      policy that browsers enforce. Resolve the origin explicitly and fail
      closed. (SEC-027, SEC-028)
    severity: ERROR
    languages: [javascript, typescript]

  # SEC-026 — a denylist for secret-shaped configuration keys. The denylist
  # missed half the real surface, so the allowlist is the only correct shape.
  - id: keystone-secret-denylist
    patterns:
      - pattern-regex: '(?i)(SENSITIVE|SECRET)_?(KEYS?|NAMES?)\s*[:=]\s*(\[|new Set)'
    # WHY THIS SCOPE — Everywhere. A hardcoded secret is a hardcoded secret, and `packages/` handles tokens while `scripts/` reads the whole security registry.
    paths:
      include:
        - "/src/**"
        - "/packages/**"
        - "/scripts/**"

    message: >-
      A denylist of secret-looking key names has to predict every name a secret
      might take, and a new secret is unredacted until someone remembers to add
      it. Use an allowlist of exposable keys. (SEC-026)
    severity: WARNING
    languages: [javascript, typescript]

  # A session cookie without `secure`, which is the whole point of the flag.
  - id: keystone-cookie-without-secure
    patterns:
      - pattern: "reply.setCookie($NAME, $VALUE, $OPTIONS)"
      - pattern-not: "reply.setCookie($NAME, $VALUE, {..., secure: $SECURE, ...})"
      # Options spread from elsewhere are not analysable here, so the rule stays
      # silent rather than reporting a finding it cannot substantiate. `auth.ts`
      # builds its options once and spreads them, and `secure` is derived from
      # NODE_ENV in that helper.
      - pattern-not: "reply.setCookie($NAME, $VALUE, {..., ...$SPREAD, ...})"
    # WHY THIS SCOPE — The server sets session cookies and so do the browser packages. `scripts/` does not touch cookies.
    paths:
      include:
        - "/src/**"
        - "/packages/**"

    message: >-
      This cookie is set without `secure`, so it will be sent over plaintext.
      Derive it from NODE_ENV rather than leaving it to configuration. (SEC-031)
    severity: WARNING
    languages: [javascript, typescript]

  # SEC-025 — the human-principal guard is inert before authentication runs.
  # This is an ordering trap, not a missing call, and no type checker or linter
  # reports it: the function is present, exported and called, and simply sees
  # nothing.
  - id: keystone-human-principal-guard-before-authenticate
    patterns:
      - pattern-inside: |
          {
            ..., preHandler: [$GUARD, $AUTH, ...], ...
          }
      - metavariable-pattern:
          metavariable: $GUARD
          patterns:
            - pattern: app.requireHumanPrincipal(...)
    # WHY THIS SCOPE — Server-side: `authenticate` is a Fastify pre-handler. No package or script has one.
    paths:
      include:
        - "/src/**"

    message: >-
      requireHumanPrincipal runs before app.authenticate, so request.serviceAccount
      is not populated yet and the guard permits every machine principal. It must
      come after authentication. (SEC-025)
    severity: ERROR
    languages: [javascript, typescript]

  # Not a vulnerability on its own, but it is how several of the findings above
  # were made invisible: a secret generated from a predictable source.
  - id: keystone-math-random-for-secret
    patterns:
      - pattern-either:
          - pattern: crypto.createHash("md5")
          - pattern: $X = Math.random().toString(36)
    # WHY THIS SCOPE — Everywhere. The SDK packages generate PKCE verifiers and nonces for the browser, which is exactly the code where `Math.random()` would be a real defect rather than a stylistic one.
    paths:
      include:
        - "/src/**"
        - "/packages/**"
        - "/scripts/**"

    message: >-
      Not a cryptographically secure source. Use `crypto.randomBytes` for
      tokens, codes and nonces.
    severity: WARNING
    languages: [javascript, typescript]

  # The layering rule, which AGENTS.md states and nothing enforced.
  #
  # `AGENTS.md`: "Routes must not import from `../db/index.js` directly — use
  # repository interfaces" and "Use `app.container.<repository>` for data access,
  # not direct DB queries." Two files did it, and the reason the rule is worth
  # enforcing rather than tidying is that a route with `db` in scope can skip a
  # repository's tenancy guarantee by accident, and nothing in a review reliably
  # catches that. It is the reason `workflows.ts` was the one place in the codebase
  # doing authorization by hand.
  #
  # `pattern-regex` rather than `pattern` because both obvious `pattern` forms
  # quietly match nothing: `import $X from ".../db/index.js"` does not treat `...`
  # as a path wildcard inside the string, and `import $X from "drizzle-orm"` does
  # not match a *named* import list, which is how both files actually import it.
  # A rule that does not fire looks exactly like a codebase with no violations, so
  # both patterns here were verified against a deliberately planted import before
  # being written down.
  - id: keystone-route-imports-db
    pattern-regex: 'import\s+\{[^}]*\bdb\b[^}]*\}\s+from\s+"(\.\./)+db/index\.js"'
    paths:
      include:
        - "/src/routes/**"
    message: >-
      A route must not import the database client. Routes parse, delegate and
      respond; data access belongs behind a repository interface in
      `src/repositories/`, which is where the tenancy guarantees live. Use
      `app.container.<repository>` — and if none does what you need, add one
      rather than reaching past it. (layering rule, AGENTS.md)
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      category: correctness
      confidence: HIGH
      cwe: "CWE-1068 (Inconsistency Between Implementation and Documented Design)"

  # The same rule by the other door. A route can import `drizzle-orm` and build its
  # own query without ever naming `db`, which is what `admin/platform.ts` did: it
  # held the client, and a reviewer scanning for `db` in a route would have found
  # the import on the next line.
  - id: keystone-route-imports-drizzle
    pattern-regex: 'import\s+[^;]*\bfrom\s+"drizzle-orm"'
    paths:
      include:
        - "/src/routes/**"
    message: >-
      A route must not import a query builder. Even with no `db` in scope this is a
      route deciding how data is read, which is the repository's job. Move the
      query into `src/repositories/` and call it through
      `app.container.<repository>`. (layering rule, AGENTS.md)
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      category: correctness
      confidence: HIGH
      cwe: "CWE-1068 (Inconsistency Between Implementation and Documented Design)"

  # §3.2 — a `throw` in the domain layer, which the whole `Result<T>` convention
  # exists to prevent.
  #
  # A `throw` in a method that returns `Result<T>` bypasses `sendResultError` on
  # the way out, so a denial the caller could have turned into a 403 becomes a
  # 500 instead. That is the failure this rule exists to stop.
  #
  # The count is already zero, so this is a tripwire rather than a fix — which is
  # the right shape for a rule about a convention: it costs nothing now and fails
  # the build the first time somebody reaches for `throw` here out of habit.
  - id: keystone-domain-layer-throws
    pattern-regex: 'throw\s+new\s+\w+'
    paths:
      include:
        - "/src/services/domain/**"
    message: >-
      Do not throw from `src/services/domain/`. Every outcome here is expressible
      as a `Result<T>`, and a thrown error bypasses `sendResultError` — so a
      denial the caller was meant to turn into a 403 surfaces as a 500. Use
      `err()` / `errFromMessage` from src/lib/result.js. If something genuinely
      cannot be a Result, it belongs outside this layer, or it needs a comment
      saying why and an entry in the registry.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      category: correctness
      confidence: HIGH
      cwe: "CWE-755 (Improper Handling of Exceptional Conditions)"

  # §3.2 — `console.*` in server code, which is how 101 unstructured lines with
  # no service name and no level got written.
  #
  # Fastify gives every route a `request.log`, carrying the request id; anything
  # outside a request gets `serviceLogger(name)` from `src/lib/logger.ts`. The
  # level comes from `KEYSTONE_LOG_LEVEL` in both cases, so one variable silences
  # the process — which is how the 3.1.0 benchmark ended up measuring its own
  # logging, because `console` ignores it.
  #
  # The exclusions are the code where stdout *is* the output rather than a
  # diagnostic: the `console` email and SMS providers exist to print a message,
  # the audit console export exists to print a record, and the setup token has to
  # be readable by an operator. Those are four files and they are listed rather
  # than allowed by pattern, so a fifth one has to be added on purpose.
  - id: keystone-no-console-in-server
    pattern-regex: '(?<!\/\/).*\bconsole\.(log|warn|error|info|debug)\s*\('
    # WHY THIS SCOPE — **not extended**, and working out why is the finding.
    #
    # Every other rule in this file was widened to cover `packages/` and
    # `scripts/`. This one cannot usefully be:
    #
    # - Nothing in `packages/` is server request-handling code. The five packages
    #   are a browser SDK, a Node client, a CLI and two framework bindings.
    # - `keystone-sdk/src/index.ts` catches a failed background connect and calls
    #   `console.error`. **In a browser library that is the only channel there
    #   is** — there is no server log to write to, and the source already carries
    #   a deliberate `eslint-disable-next-line no-console` saying so.
    # - `keystone-sdk/build.ts` is a build script, so stdout is its output.
    # - `scripts/**` is the gate suite, and a gate communicates through its output.
    #
    # So the honest scope is the server's request-handling code, which is what it
    # already was. An intermediate attempt added `/packages/**` and produced five
    # findings, every one of them a browser library correctly reporting a failure.
    #
    # A second attempt widened `src` to `/src/**` and produced **151** findings,
    # 60-odd of them in `src/cli.ts`, `src/bench/` and `src/db/seed.ts` — legitimate
    # calls the rule was never meant to see. Widening coverage only helps if the
    # rule's scope widens with it.
    paths:
      include:
        - "/src/services/**"
        - "/src/routes/**"
      exclude:
        - "/src/services/email.ts"
        - "/src/services/sms.ts"
        - "/src/services/auditExport.ts"
        - "/src/services/setup/token.ts"
        - "/src/services/connectors/google.ts"
    message: >-
      Do not use `console.*` in server code. In a route use `request.log` — or
      `app.log` where there is no request — so the line carries the request id.
      Outside a request use `serviceLogger("<component>")` from
      `src/lib/logger.ts`. If this really is program output rather than a
      diagnostic, add the file to the exclusion list in this rule with a reason.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      category: correctness
      confidence: MEDIUM
