apiVersion: apps/v1
kind: Deployment
metadata:
  name: keystone
  namespace: keystone
  labels:
    app.kubernetes.io/name: keystone
    app.kubernetes.io/part-of: hilbras
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: keystone
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keystone
    spec:
      serviceAccountName: keystone
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: keystone
          # Pinned to a version, never `:latest`.
          #
          # A deployment that pulls `latest` cannot say what it is running, and a
          # rollback has nothing to roll back to. `scripts/verify-k8s-manifests.mjs`
          # fails when this tag drifts from package.json, so the bump is part of
          # cutting a release rather than a thing somebody remembers.
          image: ghcr.io/hilbras-dev/hilbras-keystone:3.4.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 4001
              protocol: TCP
          envFrom:
            - configMapRef:
                name: keystone-config
            - secretRef:
                name: keystone-secrets
          env:
            - name: KEYSTONE_CONFIG_MODE
              value: "json"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            # /ready, not /health. `/health` is liveness: it touches nothing
            # external and answers 200 whenever the process is listening, so
            # pointing readiness at it puts a pod with no database into the load
            # balancer's rotation and every authenticated request it receives
            # fails. `/ready` checks PostgreSQL and Redis and answers 503 when
            # PostgreSQL is unreachable, 200 when Redis is not (degraded — the
            # queue falls back in-process and auth still works), 200 when both
            # are fine.
            #
            # `timeoutSeconds: 5` is a real budget: the probe bounds each
            # dependency at 2s, and the probe endpoints are exempt from the
            # global rate limiter precisely so they stay inside it. Measured with
            # both dependencies down: 576ms, 2.0s, 2.0s on repeat calls. Before
            # that exemption the same calls took 8.1s, 20.3s and 20.4s, and the
            # kubelet would have recorded a timeout instead of the answer.
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
