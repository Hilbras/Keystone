apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: keystone

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  # NOTE: no secret.yaml here on purpose. `secret.example.yaml` used to be in
  # this list, so `kubectl apply -k base` deployed its placeholder values
  # (`change-me`, an example DATABASE_URL) as the live Secret. Delete or edit
  # only the example file, not a real credential. Create the real Secret
  # out-of-band before applying — see the Quick start in k8s/README.md. The
  # verify gate still holds the manifest against the deployment's envFrom
  # references, so every required key must exist in the example/template.
  - deployment.yaml
  - service.yaml
  # **No ingress.yaml here, and its absence is the control.** The base Service is
  # a ClusterIP, so /metrics is reachable only from inside the cluster. An
  # Ingress at `path: /` matches /metrics like any other route, so the moment one
  # is added to this list the unauthenticated scrape endpoint is published to
  # whatever host the Ingress names. The Ingress therefore lives in the opt-in
  # `overlays/ingress`, which carries the exclusion that makes it safe —
  # `verify:k8s` fails if an Ingress appears in the base without one.
  - hpa.yaml
  - pdb.yaml

images:
  # The authoritative image tag. A kustomization `images` entry *overrides*
  # whatever tag the Deployment file carries, so this is the line that decides what a
  # deployment actually runs — `newTag: latest` made the tag in deployment.yaml
  # decorative. scripts/verify-k8s-manifests.mjs checks the rendered result against
  # package.json, so this is bumped with each release.
  - name: ghcr.io/hilbras/keystone
    newTag: 3.14.1-rc.1

commonLabels:
  app.kubernetes.io/name: keystone
  app.kubernetes.io/part-of: hilbras
