apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: keystone

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - secret.example.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml

images:
  # The authoritative image tag. A kustomization `images` entry *overrides*
  # whatever tag the Deployment file carries, so this is the line that decides what a
  # deployment actually runs — `newTag: latest` made the tag in deployment.yaml
  # decorative. scripts/verify-k8s-manifests.mjs checks the rendered result against
  # package.json, so this is bumped with each release.
  - name: ghcr.io/hilbras-dev/hilbras-keystone
    newTag: 3.5.8

commonLabels:
  app.kubernetes.io/name: keystone
  app.kubernetes.io/part-of: hilbras
