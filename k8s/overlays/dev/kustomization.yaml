apiVersion: kustomize.config.k8s.io/v1
kind: Kustomization

namespace: keystone-dev
namePrefix: dev-

resources:
  - ../../base

configMapGenerator:
  - name: keystone-config
    behavior: merge
    literals:
      - NODE_ENV=development
      - KEYSTONE_QUEUE_PROVIDER=in-process
      - EMAIL_PROVIDER=console
      - AUDIT_CONSOLE_EXPORT=true

replicas:
  - name: keystone
    count: 1

# **The Ingress patch that used to be here is gone, and its absence is the point.**
# This overlay used to patch the host and TLS secret of a base `ingress.yaml`. The
# base no longer ships one: it is ClusterIP-only, and an Ingress at `path: /`
# matches the unauthenticated /metrics endpoint like any other route, so putting
# one back in the base would publish it to whatever host the Ingress names. See
# docs/security/monitoring.md. That also leaves `patches:` with nothing to hold,
# so the key is gone entirely rather than left as an empty list.
#
# A dev overlay that needs a public hostname adds `../ingress`, which carries the
# host, the TLS secret and the /metrics exclusion together. Point it at this
# overlay's namespace and prefix to do that.
