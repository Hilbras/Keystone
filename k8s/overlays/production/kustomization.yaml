apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: keystone-prod

resources:
  - ../../base

namePrefix: prod-

configMapGenerator:
  - name: keystone-config
    behavior: merge
    literals:
      - NODE_ENV=production
      - KEYSTONE_QUEUE_PROVIDER=bullmq
      - EMAIL_PROVIDER=smtp
      - AUDIT_CONSOLE_EXPORT=false

replicas:
  - name: keystone
    count: 3

patches:
  # **The Ingress patch that used to be here is gone**, and its absence is the
  # point. It rewrote the host and TLS secret of a base `ingress.yaml`, which is
  # no longer in the base: the base is ClusterIP-only, and adding an Ingress back
  # to it would publish the unauthenticated /metrics endpoint to whatever host
  # the Ingress names (see docs/security/monitoring.md).
  #
  # For a public deployment use `kubectl apply -k overlays/ingress`, which builds
  # on this overlay and carries the host, the TLS secret and the /metrics
  # exclusion together. The HPA patch below is all that remains.
  - target:
      kind: HorizontalPodAutoscaler
      name: keystone
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 20
